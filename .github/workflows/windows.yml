name: Windows x64 verification

on:
  push:
    branches:
      - main
      - refactor/dart-workspace-sdk
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      LUDAVA_EXPECT_NO_RPCS3: '1'
      LUDAVA_FORMAT_EVENT_NAME: ${{ github.event_name }}
      LUDAVA_FORMAT_REF_NAME: ${{ github.ref_name }}
      LUDAVA_FORMAT_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Verify workspace membership
        run: dart pub workspace list

      - name: Test workspace dependency boundary checker
        run: .\tool\test_workspace_boundaries.ps1

      - name: Check package dependency boundaries
        run: .\tool\check_workspace_boundaries.ps1

      - name: Test changed-file formatter
        shell: pwsh
        run: .\tool\test_changed_dart_format.ps1

      - name: Check changed Dart formatting
        shell: pwsh
        run: .\tool\check_changed_dart_format.ps1

      - name: Inspect failing bridge test formatting (temporary)
        if: always()
        shell: pwsh
        run: dart format --output=show apps/ludava_app/test/integration/features/trainer/services/trainer_write_bridge.integration_test.dart


      - name: Analyze root compatibility package
        run: dart analyze

      - name: Analyze SDK
        run: dart analyze
        working-directory: packages/ludava_sdk

      - name: Analyze TUI
        run: dart analyze
        working-directory: apps/ludava_tui

      - name: Analyze Flutter app
        run: flutter analyze
        working-directory: apps/ludava_app

      - name: Build and validate portable Windows distributions
        shell: pwsh
        run: .\tool\package_windows.ps1

      - name: Build SDK integration-test discovery library
        shell: pwsh
        run: .\tool\build_process_discovery.ps1 -OutputPath build\ludava_process_discovery.dll

      - name: Test SDK
        run: dart test
        working-directory: packages/ludava_sdk

      - name: Test TUI
        run: dart test
        working-directory: apps/ludava_tui

      - name: Test Flutter app
        run: flutter test
        working-directory: apps/ludava_app

      - name: Test root compatibility entry points
        run: dart test

      - name: Check root diagnostic help
        run: dart run bin/ludava.dart --help

      - name: Check TUI package diagnostic help
        run: dart run bin/ludava.dart --help
        working-directory: apps/ludava_tui

      - name: Upload portable Windows distributions
        uses: actions/upload-artifact@v7
        with:
          name: Ludava-Windows-x64
          path: |
            build/distributions/Ludava-Desktop-Windows-x64.zip
            build/distributions/Ludava-TUI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
