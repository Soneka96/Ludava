name: Windows x64 verification

on:
  push:
    branches:
      - main
      - refactor/dart-workspace-sdk
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      LUDAVA_EXPECT_NO_RPCS3: '1'
      LUDAVA_FORMAT_EVENT_NAME: ${{ github.event_name }}
      LUDAVA_FORMAT_REF_NAME: ${{ github.ref_name }}
      LUDAVA_FORMAT_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Verify workspace membership
        run: dart pub workspace list

      - name: Test workspace dependency boundary checker
        run: .\tool\test_workspace_boundaries.ps1

      - name: Check package dependency boundaries
        run: .\tool\check_workspace_boundaries.ps1

      - name: Test changed-file formatter
        shell: pwsh
        run: .\tool\test_changed_dart_format.ps1

      - name: Check changed Dart formatting
        shell: pwsh
        run: .\tool\check_changed_dart_format.ps1

      - name: Analyze root compatibility package
        run: dart analyze

      - name: Analyze SDK
        run: dart analyze
        working-directory: packages/ludava_sdk

      - name: Analyze TUI
        run: dart analyze
        working-directory: apps/ludava_tui

      - name: Analyze Flutter app
        run: flutter analyze
        working-directory: apps/ludava_app

      - name: Build Windows executable and discovery library
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: '& "$env:GITHUB_WORKSPACE\tool\build_windows.ps1"'

      - name: Build Flutter Windows release bundle
        shell: pwsh
        run: .\tool\build_flutter_windows.ps1

      - name: Verify relocated Flutter Windows bundle
        shell: pwsh
        run: |
          $bundleDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps\ludava_app\build\windows\x64\runner\Release'
          $requiredFiles = @(
            'ludava_app.exe',
            'flutter_windows.dll',
            'cnativeapi.dll',
            'ludava_process_discovery.dll'
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundleDirectory $requiredFile) -PathType Leaf)) {
              throw "Flutter release bundle is missing $requiredFile."
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $bundleDirectory 'data\flutter_assets') -PathType Container)) {
            throw 'Flutter release bundle is missing data\flutter_assets.'
          }

          $relocatedDirectory = Join-Path $env:TEMP ("ludava-flutter-relocated-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $relocatedDirectory | Out-Null
          Get-ChildItem -LiteralPath $bundleDirectory | Copy-Item -Destination $relocatedDirectory -Recurse -Force
          $applicationPath = Join-Path $relocatedDirectory 'ludava_app.exe'
          $application = Start-Process -FilePath $applicationPath -WorkingDirectory $relocatedDirectory -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            $application.Refresh()
            if ($application.HasExited) {
              throw "Relocated Flutter app exited with code $($application.ExitCode)."
            }
          } finally {
            $application.Refresh()
            if (-not $application.HasExited) {
              Stop-Process -Id $application.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Test SDK
        run: dart test
        working-directory: packages/ludava_sdk

      - name: Test TUI
        run: dart test
        working-directory: apps/ludava_tui

      - name: Test Flutter app
        run: flutter test
        working-directory: apps/ludava_app

      - name: Test root compatibility entry points
        run: dart test

      - name: Check root diagnostic help
        run: dart run bin/ludava.dart --help

      - name: Check TUI package diagnostic help
        run: dart run bin/ludava.dart --help
        working-directory: apps/ludava_tui

      - name: Check packaged executable from another directory
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:TEMP ("ludava-ci-standalone-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $packageDirectory | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build\Ludava.exe" $packageDirectory
          Copy-Item "$env:GITHUB_WORKSPACE\build\ludava_process_discovery.dll" $packageDirectory
          Push-Location $env:TEMP
          try {
            & (Join-Path $packageDirectory 'Ludava.exe') --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Packaged help failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $packageDirectory -Recurse -Force
          }
